### General settings

set -g base-index 1
set -g history-limit 10000
set -g focus-events on
set -g xterm-keys on
set -sg escape-time 10
set -sg repeat-time 0
set-option -g renumber-windows on
set-window-option -g mode-keys vi

### Key bindings

# Prefix key
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

### Visual

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Tokyo Night Moon: purple session, blue active window, quiet inactive windows.
set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style 'none,bg=#1e2030,fg=#828bb8'
set -g status-left-length 50
set -g status-right-length 50

set -g status-left '#[fg=#c099ff,bg=#1e2030]#[fg=#1e2030,bg=#c099ff,bold] #S #[fg=#c099ff,bg=#1e2030,nobold] '
set -g status-right '#{?client_prefix,#[fg=#ffc777]#[fg=#1e2030]#[bg=#ffc777] PREFIX #[fg=#ffc777]#[bg=#1e2030] ,}#[fg=#ffc777,bg=#1e2030]#{?window_zoomed_flag, ZOOM ,}#[fg=#3b4261,bg=#1e2030]#[fg=#c8d3f5,bg=#3b4261] #h #[fg=#3b4261,bg=#1e2030]#[default] '

setw -g window-status-separator ''
setw -g window-status-style 'none,fg=#828bb8,bg=#1e2030'
setw -g window-status-current-style 'none,fg=#1e2030,bg=#82aaff'
setw -g window-status-format ' #I #W #[fg=#3b4261]'
setw -g window-status-current-format '#[fg=#82aaff,bg=#1e2030]#[fg=#1e2030,bg=#82aaff,nobold] #I #W #[fg=#82aaff,bg=#1e2030,nobold]'
setw -g window-status-activity-style 'none,fg=#c099ff,bg=#1e2030'
setw -g window-status-bell-style 'none,fg=#ffc777,bg=#1e2030'

set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#82aaff'
set -g mode-style 'fg=#1e2030,bg=#82aaff'
set -g message-style 'fg=#c8d3f5,bg=#2f334d'
set -g message-command-style 'fg=#c8d3f5,bg=#2f334d'
set -g display-panes-colour '#828bb8'
set -g display-panes-active-colour '#82aaff'

### Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
